# electron-builder packaging config. The app is compiled by electron-vite
# (`npm run build` -> out/{main,preload,renderer}); this only packages that
# output into distributable artifacts. See docs/BUILD.md.
appId: net.sputnik13.agent-cockpit
productName: Agent Cockpit

directories:
  output: release
  buildResources: build # optional icons live here (build/icon.icns, build/icon.png)

# `cpu-features` is ssh2's optional accelerator and does not compile against
# Electron 42's V8. Package scripts rebuild the two required modules explicitly
# before invoking electron-builder; do not ask electron-builder to rediscover and
# rebuild optional dependencies.
npmRebuild: false

# electron-builder can skip its `mac.sign` callback for a `--dir` package when
# no certificate is discoverable. This hook seals that package with the same
# controlled ad-hoc signer used by the normal macOS build.
afterPack: scripts/sign-macos-after-pack.mjs

# Ship the compiled app + manifest. Production `dependencies` (including the
# native better-sqlite3 / node-pty / ssh2) are bundled and rebuilt against
# Electron's ABI automatically; unpack their .node binaries from the asar so
# they can be dlopen'd at runtime.
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'

# Ship the prebuilt remote-helper binaries + manifest outside the asar so they
# can be read as plain files at runtime (they are uploaded via SFTP to the
# remote host; an asar-packed binary cannot be opened as a plain file stream).
# Landing path: Contents/Resources/remote-helper/dist (macOS) or
# resources/remote-helper/dist (Linux). Matches distDir() in helper.ts.
extraResources:
  - from: remote-helper/dist
    to: remote-helper/dist
    filter:
      - '**/*'
  - from: cockpit-mux/package-dist
    to: cockpit-mux/dist
    filter:
      - '**/*'
  - from: node_modules/@wterm/ghostty/wasm/ghostty-vt.wasm
    to: ghostty-wasm/ghostty-vt.wasm

mac:
  # electron-builder derives the macOS icon bundle from this square, alpha-preserving PNG.
  icon: build/icon.png
  category: public.app-category.developer-tools
  # The custom signer signs embedded code, refreshes the mux manifest hashes,
  # then seals the completed app bundle in one synchronous Builder hook.
  identity: '-'
  sign: scripts/sign-macos.mjs
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # Ad-hoc signed (no Apple Developer cert). Apple Silicon refuses to run a
  # fully unsigned arm64 app, so we DON'T set `identity: null` (that skips
  # signing entirely). To enable real signing + notarization later, replace
  # this identity with a Developer ID identity, set `hardenedRuntime: true`,
  # and add a `notarize` block with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID. See docs/BUILD.md.

linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
